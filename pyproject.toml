[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "comfyui-simple-float-slider"
version = "1.1.2"
description = "ComfyUI custom nodes providing styled draggable float and integer slider widgets"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.urls]
Repository = "https://github.com/Carasibana/ComfyUI-SimpleFloatSlider"

[tool.comfy]
PublisherId = "carasibana"
DisplayName = "ComfyUI-SimpleFloatSlider"
Icon   = "https://raw.githubusercontent.com/Carasibana/ComfyUI-SimpleFloatSlider/main/assets/icon-floatslider.svg"